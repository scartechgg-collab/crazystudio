<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — CrazyStudio</title>
<meta name="description" content="CrazyStudio administrator sign-in. Restricted access.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050608'/%3E%3Cpath d='M18 6l-8 5v7l5 3v-3l-2-1v-4l5-3zM16 13l5 3v2l-4 2v2l6-3v-3l-3-2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:22px">
      <div style="width:54px;height:54px;border-radius:16px;margin:0 auto;display:grid;place-items:center;background:rgba(var(--glow-r),var(--glow-g),var(--glow-b),.12);border:1px solid var(--line);color:var(--glow)" id="admin-shield"></div>
      <h2 style="color:#fff;margin-top:16px;font-size:22px">Administrator</h2>
      <p class="muted" style="font-size:13px;margin-top:4px">Restricted console. All actions are logged.</p>
    </div>
    <form class="form" id="login-form" data-tab="admin" novalidate>
      <div class="field"><label>Admin email</label><input class="input" name="email" type="email" required placeholder="team@crazystudio.fun"></div>
      <div class="field"><label>Password</label><input class="input" name="password" type="password" required placeholder="••••••••"></div>
      <label class="chk" style="font-size:13px;color:var(--muted)"><input type="checkbox" name="remember"> Trust this device</label>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:8px">Unlock console</button>
    </form>
    <p class="auth-foot" style="margin-top:18px">Default admin: <code style="color:var(--glow);font-family:var(--font-m)">team@crazystudio.fun</code><br>Password is stored in Supabase Auth — never in code.</p>
  </div>
</div>

<script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/theme.js"></script><script src="js/main.js"></script>
<script src="js/auth.js"></script><script src="js/chat.js"></script><script src="js/dashboard.js"></script><script src="js/admin.js"></script><script src="js/profile.js"></script><script src="js/search.js"></script><script src="js/notifications.js"></script><script src="js/settings.js"></script>
<script>
document.getElementById("admin-shield").innerHTML = CS.icon("shield");
// auth.js wires #login-form using its data-tab attribute ("admin") automatically.
</script>
</body></html>
